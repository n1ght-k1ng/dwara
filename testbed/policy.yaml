# Example Dwara policy for the testbed.
#
# Committed so `dwara doctor` and the integration tests have something realistic
# to run against. A real policy lives in .dwara/policy.yaml, which is gitignored.
#
# Only lab-* hosts appear here. Nothing in this repository may point Dwara at a
# machine outside the testbed.

version: 1

defaults:
  allow: [read]
  require_approval: [reversible, config]
  deny: [destructive]

hosts:
  # The lab's stand-in for production: everything that changes state needs a
  # human, and its health is checked through the reverse proxy.
  - match: 'lab-api'
    tags: [production]
    require_approval: [reversible, config]
    # Checked from lab-api itself, where nginx listens on 443. 8443 is the port
    # compose publishes to the developer machine, and using it here was wrong:
    # the host cannot reach it. Same shape as the Phase 2 open_ports bug -- the
    # value under test was not the value the code would use.
    health_checks:
      - http: 'https://127.0.0.1/health'
        expect_status: 200

  - match: 'lab-db'
    tags: [production, stateful]
    require_approval: [reversible, config]

  - match: 'lab-cache'
    tags: [production]
    require_approval: [reversible, config]

  - match: 'lab-queue'
    tags: [production, stateful]
    require_approval: [reversible, config]

  # Staging is where reversible changes may happen without asking, which is the
  # difference this lab exists to exercise.
  - match: 'lab-staging'
    tags: [staging]
    allow: [read, reversible]
    require_approval: [config]

tools:
  never: []
  overrides: {}

redaction:
  extra_patterns: []

limits:
  # 20 is the example value in DESIGN, and the Phase 2 exit gate showed it is
  # unrealistically low: a diagnosis spent all twenty on one host and was cut off
  # before it could look at the others. A real investigation reads widely before
  # it concludes anything.
  max_actions_per_session: 60
  max_hosts_per_action: 1
