# Dwara testbed: five SSH-reachable "hosts" that mimic the shape of a backend
# production stack. Each host is an Ubuntu 24.04 container running systemd as
# PID 1, which is why they are privileged and get tmpfs on /run.
#
# Base images (dwara-lab-base, dwara-lab-docker) are built first by
# testbed/scripts/up.sh, because the per-host images derive from them.
#
# No real company code, configuration, hostnames or credentials belong here.

name: dwara-lab

x-lab-host: &lab-host
  privileged: true
  tmpfs:
    - /run
    - /run/lock
    - /tmp
  stop_grace_period: 20s
  restart: unless-stopped
  networks: [labnet]

services:
  lab-api:
    <<: *lab-host
    build:
      context: .
      dockerfile: images/api/Dockerfile
    image: dwara-lab-api:dev
    container_name: lab-api
    hostname: lab-api
    # A small, bounded /var/log: the log-explosion scenario has to be able to
    # actually fill a filesystem, and must not eat the developer's disk to do it.
    tmpfs:
      - /run
      - /run/lock
      - /tmp
      - /var/log:size=128m,mode=0755
    ports:
      - '127.0.0.1:2201:22'
      - '127.0.0.1:8443:443'
    volumes:
      - lab-api-docker:/var/lib/docker
      - lab-api-containerd:/var/lib/containerd

  lab-db:
    <<: *lab-host
    build:
      context: .
      dockerfile: images/db/Dockerfile
    image: dwara-lab-db:dev
    container_name: lab-db
    hostname: lab-db
    ports:
      - '127.0.0.1:2202:22'

  lab-cache:
    <<: *lab-host
    build:
      context: .
      dockerfile: images/cache/Dockerfile
    image: dwara-lab-cache:dev
    container_name: lab-cache
    hostname: lab-cache
    ports:
      - '127.0.0.1:2203:22'

  lab-queue:
    <<: *lab-host
    build:
      context: .
      dockerfile: images/queue/Dockerfile
    image: dwara-lab-queue:dev
    container_name: lab-queue
    hostname: lab-queue
    ports:
      - '127.0.0.1:2204:22'
    volumes:
      - lab-queue-docker:/var/lib/docker
      - lab-queue-containerd:/var/lib/containerd
      - lab-queue-data:/var/lib/kafka

  # Same image as lab-api, tagged staging so policy differences between
  # production and staging have somewhere to show up.
  lab-staging:
    <<: *lab-host
    image: dwara-lab-api:dev
    container_name: lab-staging
    hostname: lab-staging
    ports:
      - '127.0.0.1:2205:22'
      - '127.0.0.1:8444:443'
    volumes:
      - lab-staging-docker:/var/lib/docker
      - lab-staging-containerd:/var/lib/containerd

networks:
  labnet:
    name: dwara-labnet

volumes:
  lab-api-docker:
  lab-api-containerd:
  lab-staging-docker:
  lab-staging-containerd:
  lab-queue-docker:
  lab-queue-containerd:
  lab-queue-data:
