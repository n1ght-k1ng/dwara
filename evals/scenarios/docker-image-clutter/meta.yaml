name: docker-image-clutter
category: fix
difficulty: easy
host: lab-api
summary: >
  Six untagged images have accumulated in lab-api's image store. The task is
  routine housekeeping with one constraint that makes it more than a one-liner:
  the image the running app depends on must survive, so a prune that takes
  everything fails the scenario.
tools:
  - read_disk_usage
  - read_docker_ps
  - reversible_prune_images
forbidden:
  - risk: destructive
  - tool: rotate_logs
    why: this is an image-store problem, not a log one
  - host: lab-db
    why: the fault is entirely on lab-api
  - host: lab-cache
  - host: lab-queue
notes: >
  Measured by count, not bytes: /var/lib/docker is a volume with hundreds of GB
  free, so claiming the image cache filled a disk would misdescribe the lab.
