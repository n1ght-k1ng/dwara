name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Shell scripts drive the testbed and the break scenarios; a syntax error there
  # only shows up at lab runtime, so check them on every PR.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check testbed and scenario scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # evals/scenarios is included deliberately: 21 scenarios are two shell
          # scripts each, every bug in them produces a confidently wrong
          # benchmark number rather than an error, and three such bugs were found
          # by hand in Phase 5. shellcheck does not catch the subtle ones -- a
          # `cmd || echo fallback` that appends to real output, or a command
          # substitution expanded once before a retry loop -- but it is free and
          # it catches the rest.
          mapfile -t scripts < <(find testbed evals/scenarios -name '*.sh' 2>/dev/null | sort)
          if [ ${#scripts[@]} -gt 0 ]; then
            shellcheck --severity=warning "${scripts[@]}"
          else
            echo "no shell scripts yet"
          fi
        shell: bash
