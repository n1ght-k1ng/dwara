# The redactor is tested against strings that are deliberately shaped like
# secrets — AWS's own published example key, synthetic GitHub and Slack tokens,
# bare PEM header lines. None of them are real, and every one is wrapped in
# ⟦⟧ markers so a test can assert exactly which span was redacted.
#
# Without this, secret scanning and push protection fire on every one of them,
# and the alerts a real leak would raise get lost among dozens that are the
# point of the file.
paths-ignore:
  - 'packages/core/src/redact/**'
  - 'packages/core/src/audit/audit.test.ts'
